# 本项目的 `cargo` 配置文件
[package]
# 项目名称，同时也是编译时输出的二进制可执行文件的名称
name = "deps-demo"
# 版本号，遵循语义化版本
version = "0.1.0"
# 项目要编译的目标版本
edition = "2024"
# 作者信息
authors = ["shiloh"]


# 项目依赖管理
[dependencies]
# 指定依赖的版本号来添加依赖
clap = "4.6.0"
# 指定源代码仓库地址来添加依赖
rand = {git = "https://github.com/rust-random/rand"}
# 指定路径来添加本地文件系统依赖
#bar = { path = "src/bar" }